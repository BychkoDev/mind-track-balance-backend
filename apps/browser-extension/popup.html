<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mind-Track Balance</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 320px; margin: 0; padding: 16px; background-color: #0f172a; color: #f8fafc; }
    h2 { margin-top: 0; font-size: 18px; text-align: center; color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .stats-container { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 300px; overflow-y: auto; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px; border-radius: 8px; font-size: 14px; }
    .domain { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65%; display: inline-block; }
    .time { color: #94a3b8; font-variant-numeric: tabular-nums; }
    button { width: 100%; padding: 10px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 16px; font-weight: bold; transition: background 0.2s; }
    button:hover { background-color: #4338ca; }
  </style>
</head>
<body>
  <div id="welcome-section" style="text-align: center; margin-bottom: 16px;">
    <h3 id="welcome-msg" style="margin: 0; color: #a5b4fc;">Welcome!</h3>
    <p style="margin: 4px 0 0 0; font-size: 13px; color: #94a3b8;">I am next to you.</p>
  </div>
  <h2>Mind-Track Activity</h2>
  
  <div id="trackingBanner" style="display: none; background-color: #f59e0b; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 12px; text-align: center;">
    <div style="font-weight: bold; margin-bottom: 6px;">Domain <span id="currentDomainName"></span> is not tracked!</div>
    <button id="trackDomainBtn" style="background-color: #fff; color: #f59e0b; padding: 4px 8px; font-weight: bold;">Add to tracking</button>
  </div>

  <div class="stats-container" id="stats">
    <div style="text-align: center; color: #94a3b8; margin-top: 20px;">Loading stats...</div>
  </div>
  <div style="display: flex; gap: 8px; margin-top: 16px;">
    <button id="syncBtn" style="background-color: #10b981;">Sync Now</button>
    <button id="resetBtn" style="background-color: #ef4444;">Reset (Debug)</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
